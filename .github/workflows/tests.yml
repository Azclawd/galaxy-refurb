name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  windows-installer:
    # Runs the exact one-line install a user would run, on a clean Windows machine.
    needs: unit
    runs-on: windows-latest
    env:
      GALAXY_REFURB_NO_START: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run installer
        shell: powershell
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
      - name: Check installed pieces
        shell: powershell
        run: |
          $h = Join-Path $env:LOCALAPPDATA 'GalaxyRefurb'
          & "$h\python\python.exe" -m galaxy_refurb --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$h\tools\platform-tools\adb.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$h\tools\samloader\samloader.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$h\GalaxyRefurb.cmd")) { exit 1 }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\Galaxy Refurb.lnk'))) { exit 1 }
      - name: App window server starts and answers (real Windows)
        shell: powershell
        run: |
          $env:GALAXY_REFURB_NO_WINDOW = '1'; $env:GALAXY_REFURB_STAY = '1'; $env:GALAXY_REFURB_PORT = '8799'
          $py = Join-Path $env:LOCALAPPDATA 'GalaxyRefurb\python\python.exe'
          $p = Start-Process -FilePath $py -ArgumentList '-m','galaxy_refurb' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $ping = Invoke-RestMethod http://127.0.0.1:8799/api/ping
          Write-Host "ping: $($ping | ConvertTo-Json -Compress)"
          $state = Invoke-RestMethod "http://127.0.0.1:8799/api/state?v=-1"
          Write-Host "device: $($state.device | ConvertTo-Json -Compress)"
          Write-Host "tools: $($state.tools | ConvertTo-Json -Compress)"
          $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          if ($ping.app -ne 'galaxy-refurb') { exit 1 }
          if ($state.device.state -ne 'none') { exit 1 }
          if (-not $state.tools.adb -or -not $state.tools.samloader) { exit 1 }
          if ($page.Content -notmatch 'Plug in a phone') { exit 1 }
      - name: Samsung firmware server lookups (models from the stock list)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # samloader writes notes to stderr; judge by exit code
          $sl = Join-Path $env:LOCALAPPDATA 'GalaxyRefurb\tools\samloader\samloader.exe'
          $ok = 0
          foreach ($m in @('SM-S921B','SM-S928B','SM-S936B','SM-A155F','SM-A356B','SM-S711B','SM-F956B')) {
            foreach ($r in @('BTU','EUX')) {
              $v = (& $sl check-update -m $m -r $r 2>&1 | Out-String).Trim()
              Write-Host "$m $r -> [$LASTEXITCODE] $v"
              if ($LASTEXITCODE -eq 0) { $ok++ }
            }
          }
          Write-Host "$ok lookups succeeded"
          if ($ok -eq 0) { exit 1 }
